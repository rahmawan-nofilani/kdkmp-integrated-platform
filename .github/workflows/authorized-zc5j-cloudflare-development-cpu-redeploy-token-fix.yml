name: Authorized ZC-5J Cloudflare DEVELOPMENT CPU Redeploy Token Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/authorized-zc5j-cloudflare-development-cpu-redeploy-token-fix.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/authorized-zc5j-cloudflare-development-cpu-redeploy-token-fix.yml'

permissions:
  contents: read

concurrency:
  group: authorized-zc5j-cloudflare-development-cpu-redeploy-token-fix
  cancel-in-progress: false

jobs:
  execute:
    name: Guarded one-time DEVELOPMENT redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENNEXT_VERSION: '1.20.2'
      WRANGLER_VERSION: '4.122.0'
      COMPATIBILITY_DATE: '2026-08-11'
      WORKER_NAME: 'kdkmp-development-pilot'
      AUTHORIZED_SOURCE_BASE: 'ab0075e34e27e9b40f7ac244faa5efdbaf19911c'
      EXPECTED_PREDEPLOY_VERSION_ID: 'c72c898e-0853-407f-a395-03c52fae6353'
      FAILED_ATTEMPT_MESSAGE: 'ZC-5J authorized CPU optimization redeploy 20260814-ab0075e3'
      REDEPLOY_MESSAGE: 'ZC5J-CPU-20260814-ab0075e3'
      NEXT_PUBLIC_SUPABASE_URL: 'https://qdxybbcksjivcidsupbd.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_euYsJqXdmpF3NFWF-e8ZWg_QaVCPZ6P'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify original one-time authorization remains exact
        shell: bash
        run: |
          set -euo pipefail
          marker='.ops/authorizations/20260814-zc5j-cloudflare-development-cpu-redeploy.txt'
          test -s "$marker"
          grep -Fxq 'AUTHORIZED_BY_USER=true' "$marker"
          grep -Fxq 'WORKER_NAME=kdkmp-development-pilot' "$marker"
          grep -Fxq "AUTHORIZED_SOURCE_BASE=${AUTHORIZED_SOURCE_BASE}" "$marker"
          grep -Fxq 'REDEPLOY_COUNT=1' "$marker"
          grep -Fxq 'PURPOSE=ZC-5J CPU remediation and re-measurement' "$marker"
          grep -Fxq 'R2=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'PAID_SERVICES=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'CUSTOM_DOMAIN=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'PRODUCTION_CUTOVER=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'PRODUCTION_DATA=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'DATABASE_WRITE=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'WORKER_DELETE=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'ROLLBACK=NOT_AUTHORIZED' "$marker"
          git merge-base --is-ancestor "$AUTHORIZED_SOURCE_BASE" HEAD
          echo 'authorization_scope=PASS'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application and pinned runner-only Cloudflare toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          cp package.json /tmp/package.json.before-zc5j-token-fix
          cp package-lock.json /tmp/package-lock.json.before-zc5j-token-fix
          npm install --no-save --package-lock=false \
            "@opennextjs/cloudflare@${OPENNEXT_VERSION}" \
            "wrangler@${WRANGLER_VERSION}"
          cmp package.json /tmp/package.json.before-zc5j-token-fix
          cmp package-lock.json /tmp/package-lock.json.before-zc5j-token-fix

      - name: Prove failed attempt made no remote deployment and preflight zero-cost state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --no-install wrangler whoami > /tmp/zc5j-whoami.txt
          grep -Fq "$CLOUDFLARE_ACCOUNT_ID" /tmp/zc5j-whoami.txt
          python3 - <<'PY'
          import json, os, urllib.request
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          worker = os.environ['WORKER_NAME']
          expected = os.environ['EXPECTED_PREDEPLOY_VERSION_ID']
          failed_marker = os.environ['FAILED_ATTEMPT_MESSAGE']
          new_marker = os.environ['REDEPLOY_MESSAGE']
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}'

          def get(path):
              req = urllib.request.Request(base + path, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              if data.get('success') is not True:
                  raise SystemExit(f'Cloudflare read failed: {path}')
              return data.get('result')

          subs = get('/subscriptions') or []
          active_states = {'Trial', 'Provisioned', 'Paid', 'AwaitingPayment'}
          paid = []
          for item in subs:
              try: price = float(item.get('price') or 0)
              except (TypeError, ValueError): price = 0
              if item.get('state') in active_states and price > 0: paid.append(item)
          print(f'predeploy_active_paid_account_subscription_count={len(paid)}')
          if paid: raise SystemExit('Active paid subscription detected.')

          workers = get('/workers/scripts') or []
          if worker not in {str(x.get('id')) for x in workers}:
              raise SystemExit('Existing DEVELOPMENT Worker missing; refusing create.')

          settings = get(f'/workers/scripts/{worker}/settings') or {}
          types = sorted({str(x.get('type','')).lower() for x in (settings.get('bindings') or [])})
          forbidden = ('r2','kv','d1','durable','service','hyperdrive','queue','vectorize')
          bad = [t for t in types if t == 'ai' or any(f in t for f in forbidden)]
          print(f'predeploy_binding_types={",".join(types) if types else "none"}')
          if bad: raise SystemExit(f'Forbidden binding types: {bad}')

          result = get(f'/workers/scripts/{worker}/deployments') or []
          deployments = result.get('deployments', []) if isinstance(result, dict) else result
          if not deployments: raise SystemExit('No deployment history.')
          old_matches = [d for d in deployments if (d.get('annotations') or {}).get('workers/message') == failed_marker]
          new_matches = [d for d in deployments if (d.get('annotations') or {}).get('workers/message') == new_marker]
          print(f'failed_attempt_marker_count={len(old_matches)}')
          print(f'new_redeploy_marker_count={len(new_matches)}')
          if old_matches or new_matches:
              raise SystemExit('A ZC-5J deployment marker already exists; refusing deploy.')
          latest = max(deployments, key=lambda d: str(d.get('created_on') or ''))
          versions = latest.get('versions') or []
          active = max(versions, key=lambda v: float(v.get('percentage') or 0)) if versions else {}
          current = str(active.get('version_id') or '')
          print(f'current_version_id={current}')
          print(f'expected_predeploy_version_id={expected}')
          if current != expected:
              raise SystemExit('Worker version changed after failed CLI attempt; authorization state is ambiguous, refusing deploy.')

          subdomain = (get('/workers/subdomain') or {}).get('subdomain')
          if not subdomain: raise SystemExit('Existing workers.dev subdomain missing.')
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'PILOT_HOST={worker}.{subdomain}.workers.dev\n')
          print('failed_attempt_remote_write=PROVEN_FALSE')
          PY

      - name: Create zero-binding config and build OpenNext
        shell: bash
        run: |
          set -euo pipefail
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF
          python3 - <<'PY'
          import json, os
          cfg = {
            '$schema':'./node_modules/wrangler/config-schema.json',
            'name':os.environ['WORKER_NAME'],
            'main':'.open-next/worker.js',
            'compatibility_date':os.environ['COMPATIBILITY_DATE'],
            'workers_dev':True,
            'assets':{'directory':'.open-next/assets','binding':'ASSETS'},
            'vars':{
              'NEXT_PUBLIC_SUPABASE_URL':os.environ['NEXT_PUBLIC_SUPABASE_URL'],
              'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY':os.environ['NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY'],
            },
          }
          with open('wrangler.jsonc','w') as f:
              json.dump(cfg,f,indent=2); f.write('\n')
          PY
          if grep -Eiq 'r2_buckets|d1_databases|kv_namespaces|durable_objects|hyperdrive|queues|services|routes|custom_domain|vectorize|"ai"' wrangler.jsonc; then exit 1; fi
          cp src/proxy.ts /tmp/zc5j-proxy.original
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/proxy.ts').read_text(); n='export async function proxy(request: NextRequest)'
          if s.count(n)!=1: raise SystemExit('Unexpected proxy export count')
          Path('src/middleware.ts').write_text(s.replace(n,'export async function middleware(request: NextRequest)'))
          PY
          rm src/proxy.ts
          npx --no-install opennextjs-cloudflare build
          test -s .open-next/worker.js
          rm -f src/middleware.ts
          cp /tmp/zc5j-proxy.original src/proxy.ts
          test -z "$(git status --porcelain -- src)"
          echo 'opennext_build=PASS'

      - name: Strict dry-run and size gate
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --dry-run --keep-vars --strict --outdir /tmp/zc5j-token-fix-out 2>&1 | tee /tmp/zc5j-token-fix-dry.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          m=re.findall(r'gzip:\s*([0-9]+(?:\.[0-9]+)?)\s*KiB',Path('/tmp/zc5j-token-fix-dry.log').read_text(),re.I)
          if not m: raise SystemExit('Unable to parse gzip size')
          size=float(m[-1]); print(f'wrangler_gzip_size_kib={size:.2f}')
          if size>=2304: raise SystemExit('Internal Free-plan size budget exceeded')
          print('worker_size_internal_budget=PASS')
          PY

      - name: Confirm PR phase is no-write
        if: github.event_name == 'pull_request'
        run: |
          echo 'pr_remote_redeployment_attempted=false'
          echo 'authorization_redeploy_consumed=false'

      - name: Execute the single authorized redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --keep-vars --strict --message "$REDEPLOY_MESSAGE" 2>&1 | tee /tmp/zc5j-token-fix-deploy.log
          echo 'remote_redeployment_succeeded=true'
          echo 'authorization_redeploy_consumed=true'

      - name: Verify exactly one new version, routes, bindings and zero-cost state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; worker=os.environ['WORKER_NAME']
          expected=os.environ['EXPECTED_PREDEPLOY_VERSION_ID']; marker=os.environ['REDEPLOY_MESSAGE']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              if data.get('success') is not True: raise SystemExit(f'Cloudflare read failed: {path}')
              return data.get('result')
          result=get(f'/workers/scripts/{worker}/deployments') or []
          deps=result.get('deployments',[]) if isinstance(result,dict) else result
          matches=[d for d in deps if (d.get('annotations') or {}).get('workers/message')==marker]
          print(f'postdeploy_marker_count={len(matches)}')
          if len(matches)!=1: raise SystemExit('Expected exactly one authorized deployment marker')
          versions=matches[0].get('versions') or []
          active=max(versions,key=lambda v:float(v.get('percentage') or 0)) if versions else {}
          new=str(active.get('version_id') or '')
          print(f'predeploy_version_id={expected}'); print(f'postdeploy_version_id={new}')
          if not new or new==expected: raise SystemExit('Worker version did not transition')
          settings=get(f'/workers/scripts/{worker}/settings') or {}
          types=sorted({str(x.get('type','')).lower() for x in (settings.get('bindings') or [])})
          forbidden=('r2','kv','d1','durable','service','hyperdrive','queue','vectorize')
          bad=[t for t in types if t=='ai' or any(f in t for f in forbidden)]
          print(f'postdeploy_binding_types={",".join(types) if types else "none"}')
          if bad: raise SystemExit(f'Forbidden bindings after deploy: {bad}')
          subs=get('/subscriptions') or []; states={'Trial','Provisioned','Paid','AwaitingPayment'}; paid=[]
          for x in subs:
              try: price=float(x.get('price') or 0)
              except (TypeError,ValueError): price=0
              if x.get('state') in states and price>0: paid.append(x)
          print(f'postdeploy_active_paid_account_subscription_count={len(paid)}')
          if paid: raise SystemExit('Paid subscription appeared after deploy')
          print('worker_version_transition=PASS'); print('postdeploy_zero_cost_gate=PASS')
          PY
          base="https://${PILOT_HOST}"
          status(){ curl --silent --show-error --max-time 20 -D "$2" -o /dev/null -w '%{http_code}' "${base}$1"; }
          health='000'; for i in $(seq 1 12); do health="$(status '/api/health' /tmp/hh || true)"; [ "$health" = 200 ] && break; sleep 5; done
          test "$health" = 200
          root="$(status '/' /tmp/rh)"; login="$(status '/login' /tmp/lh)"; dash="$(status '/dashboard' /tmp/dh)"
          test "$root" = 307; test "$login" = 200; test "$dash" = 307
          grep -Eiq '^location: .*\/dashboard' /tmp/rh; grep -Eiq '^location: .*\/login' /tmp/dh
          echo 'remote_route_contract=PASS'

      - name: Final boundary record
        if: always()
        run: |
          echo 'authorized_redeploy_limit=1'
          echo 'r2_activated=false'
          echo 'paid_service_activated=false'
          echo 'custom_domain_configured=false'
          echo 'production_cutover=false'
          echo 'production_data_used=false'
          echo 'database_write_attempted=false'
          echo 'worker_delete_attempted=false'
          echo 'rollback_attempted=false'

      - name: Confirm runner tooling left tracked application files unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/package.json.before-zc5j-token-fix ]; then
            cmp package.json /tmp/package.json.before-zc5j-token-fix
            cmp package-lock.json /tmp/package-lock.json.before-zc5j-token-fix
          fi
          test -z "$(git status --porcelain -- package.json package-lock.json src)"
          echo 'repository_source_mutation=false'
