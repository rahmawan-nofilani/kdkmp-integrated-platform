name: Temporary provider settlement security fix

on:
  push:
    branches:
      - agent/pos-trusted-provider-confirmation-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix provider settlement definer boundary') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pos-trusted-provider-confirmation-reconciliation
      - name: Patch unapplied provider migration
        shell: python
        run: |
          from pathlib import Path
          p = Path('database/migrations/20260818061133_pos_trusted_provider_confirmation_reconciliation_foundation.sql')
          s = p.read_text()
          marker = "create or replace function public.reconcile_pos_provider_settlement("
          i = s.index(marker)
          j = s.index("set search_path to ''", i)
          segment = s[i:j]
          if "security invoker" not in segment:
              raise SystemExit('expected settlement SECURITY INVOKER not found')
          segment = segment.replace('security invoker', 'security definer', 1)
          s = s[:i] + segment + s[j:]
          p.write_text(s)
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database/migrations/20260818061133_pos_trusted_provider_confirmation_reconciliation_foundation.sql
          git commit -m "fix provider settlement definer boundary"
          git push origin HEAD:agent/pos-trusted-provider-confirmation-reconciliation
