name: Temporary provider migration runtime fix

on:
  push:
    branches:
      - agent/pos-trusted-provider-confirmation-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix provider receipt generated column') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pos-trusted-provider-confirmation-reconciliation
      - name: Patch unapplied provider migration
        shell: python
        run: |
          from pathlib import Path
          p = Path('database/migrations/20260818061133_pos_trusted_provider_confirmation_reconciliation_foundation.sql')
          s = p.read_text()
          old_cols = "receipt_number,currency,subtotal,discount_amount,tax_amount,total_amount,cash_received,change_amount,payment_channel,payload,issued_at,created_by"
          new_cols = "receipt_number,currency,subtotal,discount_amount,tax_amount,total_amount,cash_received,payment_channel,payload,issued_at,created_by"
          old_vals = "v_receipt_number,v_sale.currency,v_gross,v_discount,v_tax,v_total,null,null,v_attempt.channel,"
          new_vals = "v_receipt_number,v_sale.currency,v_gross,v_discount,v_tax,v_total,null,v_attempt.channel,"
          if old_cols not in s or old_vals not in s:
              raise SystemExit('expected receipt insert text not found')
          s = s.replace(old_cols, new_cols, 1).replace(old_vals, new_vals, 1)
          s = s.replace("where psi.settlement_batch_id=v_batch.id and psi.match_status='MATCHED'\n    for update", "where psi.settlement_batch_id=v_batch.id and psi.match_status='MATCHED'\n    for update of pa", 1)
          p.write_text(s)
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database/migrations/20260818061133_pos_trusted_provider_confirmation_reconciliation_foundation.sql
          git commit -m "fix provider receipt generated column and settlement locking"
          git push origin HEAD:agent/pos-trusted-provider-confirmation-reconciliation
