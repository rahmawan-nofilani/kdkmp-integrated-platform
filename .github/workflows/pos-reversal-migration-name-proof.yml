name: POS Reversal Migration Name Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'database/drafts/pos_cash_reversal_*.sql'
      - '.github/workflows/pos-reversal-migration-name-proof.yml'

permissions:
  contents: read

jobs:
  generate-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_CLI_VERSION: "2.113.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate canonical migration basename
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$RUNNER_TEMP/pos-reversal-migration-name"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init >/dev/null
          GENERATED="$(npx --yes "supabase@${SUPABASE_CLI_VERSION}" migration new pos_cash_reversal_controlled_void | sed -n 's/.*Created new migration at \(.*\.sql\).*/\1/p' | tail -n 1)"
          if [ -z "$GENERATED" ]; then
            GENERATED="$(find supabase/migrations -maxdepth 1 -type f -name '*_pos_cash_reversal_controlled_void.sql' -printf '%f\n' | head -n 1)"
          else
            GENERATED="$(basename "$GENERATED")"
          fi
          if ! printf '%s' "$GENERATED" | grep -Eq '^[0-9]{14}_pos_cash_reversal_controlled_void\.sql$'; then
            echo "Canonical migration basename generation failed: $GENERATED" >&2
            exit 1
          fi
          echo "CANONICAL_MIGRATION_BASENAME=$GENERATED"
