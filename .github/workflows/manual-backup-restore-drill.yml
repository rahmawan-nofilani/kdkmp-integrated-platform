name: Manual Backup & Restore Drill

on:
  workflow_dispatch:
    inputs:
      retention_class:
        description: Retention class recorded in the backup registry
        required: false
        default: MANUAL
        type: choice
        options:
          - MANUAL
          - DAILY
          - WEEKLY
          - MONTHLY

permissions:
  contents: read

concurrency:
  group: manual-backup-restore-drill
  cancel-in-progress: false

jobs:
  backup_restore_drill:
    name: encrypted backup + local restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      SUPABASE_CLI_VERSION: "2.113.0"
      BACKUP_RETENTION_CLASS: ${{ inputs.retention_class || 'MANUAL' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned Supabase CLI version
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_VERSION="$(npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version | tr -d '\r')"
          if [ "$ACTUAL_VERSION" != "$SUPABASE_CLI_VERSION" ]; then
            echo "Pinned Supabase CLI version mismatch: expected $SUPABASE_CLI_VERSION, got $ACTUAL_VERSION" >&2
            exit 1
          fi
          echo "Using pinned Supabase CLI $ACTUAL_VERSION"

      - name: Validate retention class
        shell: bash
        run: |
          set -euo pipefail
          case "$BACKUP_RETENTION_CLASS" in
            MANUAL|DAILY|WEEKLY|MONTHLY) ;;
            *)
              echo "Unsupported backup retention class: $BACKUP_RETENTION_CLASS" >&2
              exit 1
              ;;
          esac
          echo "Backup retention class: $BACKUP_RETENTION_CLASS"

      - name: Validate required secrets and database URL shape
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_DB_URL" >&2
            exit 1
          fi
          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]; then
            echo "Missing GitHub Actions secret: BACKUP_ENCRYPTION_PASSPHRASE" >&2
            exit 1
          fi
          if [ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 24 ]; then
            echo "BACKUP_ENCRYPTION_PASSPHRASE must be at least 24 characters." >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          value = os.environ.get("SUPABASE_DB_URL", "")
          if value != value.strip():
              print("SUPABASE_DB_URL has leading/trailing whitespace. Recreate the GitHub secret from the Supabase copy button.", file=sys.stderr)
              raise SystemExit(1)
          if value[:1] in {'\"', "'", '`'} or value[-1:] in {'\"', "'", '`'}:
              print("SUPABASE_DB_URL must not include quote/backtick characters around the URL.", file=sys.stderr)
              raise SystemExit(1)

          try:
              parsed = urlsplit(value)
              port = parsed.port
          except Exception:
              print("SUPABASE_DB_URL is not a valid PostgreSQL URL. Do not print the secret; recreate it from Supabase Session pooler.", file=sys.stderr)
              raise SystemExit(1)

          if parsed.scheme not in {"postgres", "postgresql"}:
              print("SUPABASE_DB_URL must start with postgres:// or postgresql://.", file=sys.stderr)
              raise SystemExit(1)
          if not parsed.hostname or not parsed.hostname.endswith(".pooler.supabase.com"):
              print("SUPABASE_DB_URL must use the Supabase Shared/Session pooler host ending in .pooler.supabase.com.", file=sys.stderr)
              raise SystemExit(1)
          if port != 5432:
              print("SUPABASE_DB_URL must use Session pooler port 5432, not transaction pooler port 6543.", file=sys.stderr)
              raise SystemExit(1)
          if parsed.path != "/postgres":
              print("SUPABASE_DB_URL must target database /postgres.", file=sys.stderr)
              raise SystemExit(1)
          if not parsed.username or not parsed.username.startswith("postgres."):
              print("SUPABASE_DB_URL must use the Session pooler username beginning with postgres.<project-ref>.", file=sys.stderr)
              raise SystemExit(1)
          if not parsed.password or parsed.password == "[YOUR-PASSWORD]":
              print("SUPABASE_DB_URL does not contain a database password. Replace [YOUR-PASSWORD] locally before saving the GitHub secret.", file=sys.stderr)
              raise SystemExit(1)

          print("SUPABASE_DB_URL shape validated: Session pooler, port 5432, database postgres. Secret value was not printed.")
          PY

      - name: Verify remote database connectivity
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm postgres:17-alpine \
            psql --dbname="$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -c "select case when current_database()='postgres' then 'ok' else 'unexpected_database' end;" \
            | grep -qx 'ok'

      - name: Create backup run registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          RUN_NUMBER="BKP-${STAMP}-${GITHUB_RUN_ID}"
          BACKUP_ID="$(docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "insert into public.system_backup_runs(backup_run_number,backup_type,retention_class,status,storage_provider,encrypted,source,manifest) values ('$RUN_NUMBER','MANUAL_LOGICAL','$BACKUP_RETENTION_CLASS','REQUESTED','GITHUB_ARTIFACT',true,'GITHUB_ACTIONS',jsonb_build_object('github_run_id','$GITHUB_RUN_ID','github_sha','$GITHUB_SHA','supabase_cli_version','$SUPABASE_CLI_VERSION','retention_class','$BACKUP_RETENTION_CLASS')) returning id;")"
          printf '%s' "$BACKUP_ID" > "$RUNNER_TEMP/backup-run-id.txt"
          docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -c "update public.system_backup_runs set status='RUNNING' where id='$BACKUP_ID';"
          echo "backup_id=$BACKUP_ID" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Dump DEVELOPMENT database
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/kdkmp-backup-${{ steps.registry.outputs.stamp }}"
          mkdir -p "$BACKUP_DIR"

          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/roles.sql" --role-only
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/schema.sql"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/data.sql" --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/history_schema.sql" --schema supabase_migrations
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db dump --db-url "$SUPABASE_DB_URL" -f "$BACKUP_DIR/history_data.sql" --use-copy --data-only --schema supabase_migrations

          docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "select jsonb_build_object('auth_users',(select count(*) from auth.users),'profiles',(select count(*) from public.profiles),'members',(select count(*) from public.members),'sales_transactions',(select count(*) from public.sales_transactions),'journal_entries',(select count(*) from public.journal_entries),'inventory_movements',(select count(*) from public.inventory_movements),'pos_receipts',(select count(*) from public.pos_receipts),'backup_runs',(select count(*) from public.system_backup_runs))::text;" > "$BACKUP_DIR/source_counts.json"

          test -s "$BACKUP_DIR/roles.sql"
          test -s "$BACKUP_DIR/schema.sql"
          test -s "$BACKUP_DIR/data.sql"
          test -s "$BACKUP_DIR/source_counts.json"

      - name: Prepare portable role restore file
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/kdkmp-backup-${{ steps.registry.outputs.stamp }}"
          export BACKUP_DIR
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          backup_dir = Path(os.environ["BACKUP_DIR"])
          source_path = backup_dir / "roles.sql"
          restore_path = backup_dir / "roles.restore.sql"
          report_path = backup_dir / "restore_sanitization.json"

          source = source_path.read_text(encoding="utf-8")

          dollar_tag_re = re.compile(r"\$(?:[A-Za-z_][A-Za-z0-9_]*)?\$")

          def split_sql_statements(text: str):
              statements = []
              start = 0
              i = 0
              state = "normal"
              dollar_tag = None
              block_depth = 0

              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""

                  if state == "normal":
                      if ch == "-" and nxt == "-":
                          state = "line_comment"
                          i += 2
                          continue
                      if ch == "/" and nxt == "*":
                          state = "block_comment"
                          block_depth = 1
                          i += 2
                          continue
                      if ch == "'":
                          state = "single_quote"
                          i += 1
                          continue
                      if ch == '"':
                          state = "double_quote"
                          i += 1
                          continue
                      if ch == "$":
                          match = dollar_tag_re.match(text, i)
                          if match:
                              dollar_tag = match.group(0)
                              state = "dollar_quote"
                              i = match.end()
                              continue
                      if ch == ";":
                          statements.append(text[start:i + 1])
                          start = i + 1
                      i += 1
                      continue

                  if state == "line_comment":
                      if ch == "\n":
                          state = "normal"
                      i += 1
                      continue

                  if state == "block_comment":
                      if ch == "/" and nxt == "*":
                          block_depth += 1
                          i += 2
                          continue
                      if ch == "*" and nxt == "/":
                          block_depth -= 1
                          i += 2
                          if block_depth == 0:
                              state = "normal"
                          continue
                      i += 1
                      continue

                  if state == "single_quote":
                      if ch == "'" and nxt == "'":
                          i += 2
                          continue
                      if ch == "'":
                          state = "normal"
                      i += 1
                      continue

                  if state == "double_quote":
                      if ch == '"' and nxt == '"':
                          i += 2
                          continue
                      if ch == '"':
                          state = "normal"
                      i += 1
                      continue

                  if state == "dollar_quote":
                      if dollar_tag and text.startswith(dollar_tag, i):
                          i += len(dollar_tag)
                          dollar_tag = None
                          state = "normal"
                          continue
                      i += 1
                      continue

              if state not in {"normal", "line_comment"}:
                  raise SystemExit(f"roles.sql ended inside an unterminated SQL construct: {state}")

              if start < len(text):
                  statements.append(text[start:])
              return statements

          statements = split_sql_statements(source)
          kept = []
          removed_statement_count = 0
          removed_alter_role_set_count = 0
          removed_log_min_messages_statement_count = 0

          alter_role_set_re = re.compile(r"\bALTER\s+(?:ROLE|USER)\b[\s\S]*?\bSET\b", re.IGNORECASE)
          log_min_messages_re = re.compile(r"\blog_min_messages\b", re.IGNORECASE)

          for statement in statements:
              has_alter_role_set = bool(alter_role_set_re.search(statement))
              has_log_min_messages = bool(log_min_messages_re.search(statement))

              if has_alter_role_set or has_log_min_messages:
                  removed_statement_count += 1
                  if has_alter_role_set:
                      removed_alter_role_set_count += 1
                  if has_log_min_messages:
                      removed_log_min_messages_statement_count += 1
                  continue

              kept.append(statement)

          portable = "".join(kept)
          if not portable.strip():
              raise SystemExit("Portable roles restore file would be empty; refusing to continue.")

          portable_statements = split_sql_statements(portable)
          if any(alter_role_set_re.search(statement) for statement in portable_statements):
              raise SystemExit("Portable roles restore file still contains ALTER ROLE/USER ... SET statement(s).")
          if any(log_min_messages_re.search(statement) for statement in portable_statements):
              raise SystemExit("Portable roles restore file still contains a statement referencing log_min_messages.")

          restore_path.write_text(portable, encoding="utf-8")
          report = {
              "policy": "statement_based_remove_managed_role_settings_for_local_restore_only",
              "parser": "semicolon_aware_with_sql_quotes_comments_and_dollar_quoting",
              "source_statement_count": len(statements),
              "portable_statement_count": len(portable_statements),
              "removed_statement_count": removed_statement_count,
              "removed_alter_role_set_count": removed_alter_role_set_count,
              "removed_log_min_messages_statement_count": removed_log_min_messages_statement_count,
              "original_roles_sha256": hashlib.sha256(source.encode("utf-8")).hexdigest(),
              "portable_roles_sha256": hashlib.sha256(portable.encode("utf-8")).hexdigest(),
              "original_roles_preserved": True,
          }
          report_path.write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          print(
              "Prepared statement-based portable roles restore file; removed "
              f"{removed_statement_count} managed-setting statement(s), including "
              f"{removed_log_min_messages_statement_count} referencing log_min_messages."
          )
          PY
          test -s "$BACKUP_DIR/roles.restore.sql"
          test -s "$BACKUP_DIR/restore_sanitization.json"

      - name: Preflight portable role restore file
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/kdkmp-backup-${{ steps.registry.outputs.stamp }}"
          export BACKUP_DIR
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          backup_dir = Path(os.environ["BACKUP_DIR"])
          portable = (backup_dir / "roles.restore.sql").read_text(encoding="utf-8")
          report = json.loads((backup_dir / "restore_sanitization.json").read_text(encoding="utf-8"))

          if not report.get("original_roles_preserved"):
              raise SystemExit("Restore sanitization report does not confirm preservation of original roles.sql.")
          if report.get("removed_statement_count", 0) < 1:
              raise SystemExit("Restore sanitizer removed no managed-setting statements; refusing local restore because prior drills proved managed settings are present.")
          if re.search(r"\blog_min_messages\b", portable, re.IGNORECASE):
              raise SystemExit("Preflight failed: roles.restore.sql still references log_min_messages.")
          if re.search(r"\bALTER\s+(?:ROLE|USER)\b[\s\S]*?\bSET\b", portable, re.IGNORECASE):
              raise SystemExit("Preflight failed: roles.restore.sql still contains ALTER ROLE/USER ... SET.")

          print("Portable role restore preflight passed before local Supabase startup.")
          PY

      - name: Start isolated local Supabase restore target
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_DIR="$RUNNER_TEMP/kdkmp-restore-target"
          mkdir -p "$LOCAL_DIR"
          cd "$LOCAL_DIR"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init --force
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" start
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo "Local Supabase database container was not found." >&2
            exit 1
          fi
          printf '%s' "$DB_CONTAINER" > "$RUNNER_TEMP/local-db-container.txt"

      - name: Restore backup into isolated local Supabase
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          START_EPOCH="$(date +%s)"
          BACKUP_ID="${{ steps.registry.outputs.backup_id }}"
          STAMP="${{ steps.registry.outputs.stamp }}"
          BACKUP_DIR="$RUNNER_TEMP/kdkmp-backup-$STAMP"
          DB_CONTAINER="$(cat "$RUNNER_TEMP/local-db-container.txt")"
          RESTORE_NUMBER="RST-${STAMP}-${GITHUB_RUN_ID}"

          RESTORE_ID="$(docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "insert into public.system_restore_tests(backup_run_id,restore_test_number,status,target_type,notes) values ('$BACKUP_ID','$RESTORE_NUMBER','REQUESTED','TEMPORARY_LOCAL','GitHub Actions isolated local Supabase restore drill') returning id;")"
          printf '%s' "$RESTORE_ID" > "$RUNNER_TEMP/restore-test-id.txt"
          docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -c "update public.system_restore_tests set status='RUNNING' where id='$RESTORE_ID';"

          for file in roles.restore.sql schema.sql data.sql history_schema.sql history_data.sql; do
            docker cp "$BACKUP_DIR/$file" "$DB_CONTAINER:/tmp/$file"
          done

          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c "alter default privileges in schema public revoke all on tables from anon, authenticated;"
          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -X --single-transaction -v ON_ERROR_STOP=1 \
            --file /tmp/roles.restore.sql \
            --file /tmp/schema.sql \
            --command "set session_replication_role = replica" \
            --file /tmp/data.sql

          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -X --single-transaction -v ON_ERROR_STOP=1 \
            --file /tmp/history_schema.sql \
            --file /tmp/history_data.sql

          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -c "select jsonb_build_object('auth_users',(select count(*) from auth.users),'profiles',(select count(*) from public.profiles),'members',(select count(*) from public.members),'sales_transactions',(select count(*) from public.sales_transactions),'journal_entries',(select count(*) from public.journal_entries),'inventory_movements',(select count(*) from public.inventory_movements),'pos_receipts',(select count(*) from public.pos_receipts),'backup_runs',(select count(*) from public.system_backup_runs))::text;" > "$BACKUP_DIR/restored_counts.json"

          jq -S . "$BACKUP_DIR/source_counts.json" > "$BACKUP_DIR/source_counts.sorted.json"
          jq -S . "$BACKUP_DIR/restored_counts.json" > "$BACKUP_DIR/restored_counts.sorted.json"
          diff -u "$BACKUP_DIR/source_counts.sorted.json" "$BACKUP_DIR/restored_counts.sorted.json"

          UNVALIDATED_FK="$(docker exec "$DB_CONTAINER" psql -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -c "select count(*) from pg_constraint where contype='f' and not convalidated and connamespace in ('public'::regnamespace,'app_private'::regnamespace);")"
          if [ "$UNVALIDATED_FK" != "0" ]; then
            echo "Restore target contains $UNVALIDATED_FK unvalidated foreign keys." >&2
            exit 1
          fi

          END_EPOCH="$(date +%s)"
          DURATION="$((END_EPOCH - START_EPOCH))"
          SOURCE_JSON="$(jq -c . "$BACKUP_DIR/source_counts.json")"
          RESTORED_JSON="$(jq -c . "$BACKUP_DIR/restored_counts.json")"
          CHECKS_JSON="$(jq -cn --arg unvalidated_fk "$UNVALIDATED_FK" --argjson role_sanitization "$(cat "$BACKUP_DIR/restore_sanitization.json")" --arg supabase_cli_version "$SUPABASE_CLI_VERSION" '{row_counts_match:true,unvalidated_foreign_keys:($unvalidated_fk|tonumber),restore_target:"local_supabase",role_sanitization:$role_sanitization,supabase_cli_version:$supabase_cli_version}')"

          docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -c "update public.system_restore_tests set status='PASSED',duration_seconds=$DURATION,row_count_checks=jsonb_build_object('source','$SOURCE_JSON'::jsonb,'restored','$RESTORED_JSON'::jsonb),integrity_checks='$CHECKS_JSON'::jsonb,notes='Local Supabase restore completed and selected row counts matched; managed role settings were sanitized only for the local restore target.' where id='$RESTORE_ID';"
          echo "restore_id=$RESTORE_ID" >> "$GITHUB_OUTPUT"

      - name: Build encrypted artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          STAMP="${{ steps.registry.outputs.stamp }}"
          BACKUP_DIR="$RUNNER_TEMP/kdkmp-backup-$STAMP"
          PACKAGE_DIR="$RUNNER_TEMP/kdkmp-package-$STAMP"
          mkdir -p "$PACKAGE_DIR"

          (
            cd "$BACKUP_DIR"
            sha256sum roles.sql schema.sql data.sql history_schema.sql history_data.sql source_counts.json restored_counts.json restore_sanitization.json > FILES.sha256
          )

          jq -n \
            --arg backup_run_number "${{ steps.registry.outputs.run_number }}" \
            --arg github_run_id "$GITHUB_RUN_ID" \
            --arg github_sha "$GITHUB_SHA" \
            --arg supabase_cli_version "$SUPABASE_CLI_VERSION" \
            --arg retention_class "$BACKUP_RETENTION_CLASS" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_counts "$(jq -c . "$BACKUP_DIR/source_counts.json")" \
            --arg restored_counts "$(jq -c . "$BACKUP_DIR/restored_counts.json")" \
            --arg role_sanitization "$(jq -c . "$BACKUP_DIR/restore_sanitization.json")" \
            '{backup_run_number:$backup_run_number,github_run_id:$github_run_id,github_sha:$github_sha,supabase_cli_version:$supabase_cli_version,retention_class:$retention_class,created_at:$created_at,encrypted:true,restore_test:"PASSED",source_counts:($source_counts|fromjson),restored_counts:($restored_counts|fromjson),role_sanitization:($role_sanitization|fromjson)}' \
            > "$BACKUP_DIR/manifest.json"

          TAR_PATH="$PACKAGE_DIR/kdkmp-development-$STAMP.tar.gz"
          ENC_PATH="$TAR_PATH.enc"
          tar -C "$BACKUP_DIR" -czf "$TAR_PATH" roles.sql schema.sql data.sql history_schema.sql history_data.sql source_counts.json restored_counts.json restore_sanitization.json FILES.sha256 manifest.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$TAR_PATH" -out "$ENC_PATH" -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          rm -f "$TAR_PATH"

          SHA="$(sha256sum "$ENC_PATH" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$ENC_PATH")"
          printf '%s  %s\n' "$SHA" "$(basename "$ENC_PATH")" > "$ENC_PATH.sha256"

          OBJECT_KEY="github-artifact://actions/runs/$GITHUB_RUN_ID/$(basename "$ENC_PATH")"
          BACKUP_ID="${{ steps.registry.outputs.backup_id }}"
          MANIFEST_JSON="$(jq -c . "$BACKUP_DIR/manifest.json")"
          docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -c "update public.system_backup_runs set status='UPLOADED',object_key='$OBJECT_KEY',size_bytes=$SIZE,sha256='$SHA',manifest='$MANIFEST_JSON'::jsonb where id='$BACKUP_ID';"

          echo "artifact_path=$ENC_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$ENC_PATH.sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=kdkmp-development-backup-$STAMP" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Download encrypted backup artifact for read-back
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/kdkmp-readback-${{ steps.registry.outputs.stamp }}

      - name: Verify downloaded artifact checksum and decryptability
        id: readback
        shell: bash
        run: |
          set -euo pipefail
          STAMP="${{ steps.registry.outputs.stamp }}"
          READBACK_DIR="$RUNNER_TEMP/kdkmp-readback-$STAMP"
          ENC_NAME="kdkmp-development-$STAMP.tar.gz.enc"
          CHECKSUM_NAME="$ENC_NAME.sha256"
          DECRYPTED_TAR="$RUNNER_TEMP/kdkmp-readback-$STAMP.tar.gz"
          EXTRACT_DIR="$RUNNER_TEMP/kdkmp-readback-extracted-$STAMP"
          EXPECTED_LIST="$RUNNER_TEMP/kdkmp-readback-expected-$STAMP.txt"
          ACTUAL_LIST="$RUNNER_TEMP/kdkmp-readback-actual-$STAMP.txt"

          cleanup_readback() {
            rm -f "$DECRYPTED_TAR" "$EXPECTED_LIST" "$ACTUAL_LIST"
            rm -rf "$EXTRACT_DIR"
          }
          trap cleanup_readback EXIT

          test -f "$READBACK_DIR/$ENC_NAME"
          test -f "$READBACK_DIR/$CHECKSUM_NAME"

          FILE_COUNT="$(find "$READBACK_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$FILE_COUNT" != "2" ]; then
            echo "Read-back artifact must contain exactly the encrypted backup and its checksum; found $FILE_COUNT files." >&2
            exit 1
          fi

          (
            cd "$READBACK_DIR"
            sha256sum -c "$CHECKSUM_NAME"
          )

          READBACK_SHA="$(sha256sum "$READBACK_DIR/$ENC_NAME" | awk '{print $1}')"
          if [ "$READBACK_SHA" != "${{ steps.package.outputs.sha256 }}" ]; then
            echo "Read-back encrypted artifact SHA-256 does not match the value registered before upload." >&2
            exit 1
          fi

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$READBACK_DIR/$ENC_NAME" \
            -out "$DECRYPTED_TAR" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE

          printf '%s\n' \
            roles.sql \
            schema.sql \
            data.sql \
            history_schema.sql \
            history_data.sql \
            source_counts.json \
            restored_counts.json \
            restore_sanitization.json \
            FILES.sha256 \
            manifest.json \
            | sort > "$EXPECTED_LIST"
          tar -tzf "$DECRYPTED_TAR" | sort > "$ACTUAL_LIST"
          diff -u "$EXPECTED_LIST" "$ACTUAL_LIST"

          mkdir -p "$EXTRACT_DIR"
          tar -xzf "$DECRYPTED_TAR" -C "$EXTRACT_DIR"
          (
            cd "$EXTRACT_DIR"
            sha256sum -c FILES.sha256
            jq -e \
              --arg backup_run_number "${{ steps.registry.outputs.run_number }}" \
              --arg github_run_id "$GITHUB_RUN_ID" \
              --arg github_sha "$GITHUB_SHA" \
              --arg supabase_cli_version "$SUPABASE_CLI_VERSION" \
              --arg retention_class "$BACKUP_RETENTION_CLASS" \
              '.encrypted == true and
               .restore_test == "PASSED" and
               .backup_run_number == $backup_run_number and
               .github_run_id == $github_run_id and
               .github_sha == $github_sha and
               .supabase_cli_version == $supabase_cli_version and
               .retention_class == $retention_class and
               .source_counts == .restored_counts' \
              manifest.json > /dev/null
          )

          VERIFIED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "verified_at=$VERIFIED_AT" >> "$GITHUB_OUTPUT"
          echo "Encrypted artifact read-back, checksum, decryption, inner checksums, manifest retention class, and manifest verification passed."

      - name: Mark backup verified
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_ID="${{ steps.registry.outputs.backup_id }}"
          READBACK_AT="${{ steps.readback.outputs.verified_at }}"
          docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -c "update public.system_backup_runs set status='VERIFIED',manifest=manifest || jsonb_build_object('artifact_readback','PASSED','artifact_readback_verified_at','$READBACK_AT','supabase_cli_version','$SUPABASE_CLI_VERSION','retention_class','$BACKUP_RETENTION_CLASS') where id='$BACKUP_ID';"

      - name: Mark registry failed when workflow fails
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -n "${SUPABASE_DB_URL:-}" ] && [ -f "$RUNNER_TEMP/restore-test-id.txt" ]; then
            RESTORE_ID="$(cat "$RUNNER_TEMP/restore-test-id.txt")"
            docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -q -c "update public.system_restore_tests set status='FAILED',error_summary='GitHub Actions restore drill failed; inspect workflow logs.' where id='$RESTORE_ID' and status in ('REQUESTED','RUNNING');" || true
          fi
          if [ -n "${SUPABASE_DB_URL:-}" ] && [ -f "$RUNNER_TEMP/backup-run-id.txt" ]; then
            BACKUP_ID="$(cat "$RUNNER_TEMP/backup-run-id.txt")"
            docker run --rm postgres:17-alpine psql --dbname="$SUPABASE_DB_URL" -X -q -c "update public.system_backup_runs set status='FAILED',error_summary='GitHub Actions backup workflow failed; inspect workflow logs.' where id='$BACKUP_ID' and status in ('REQUESTED','RUNNING','UPLOADED');" || true
          fi

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          set +e
          LOCAL_DIR="$RUNNER_TEMP/kdkmp-restore-target"
          if [ -d "$LOCAL_DIR/supabase" ]; then
            cd "$LOCAL_DIR"
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true
          fi
