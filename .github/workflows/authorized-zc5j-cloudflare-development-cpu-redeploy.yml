name: Authorized ZC-5J Cloudflare DEVELOPMENT CPU Redeploy

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/authorized-zc5j-cloudflare-development-cpu-redeploy.yml'
      - '.ops/authorizations/20260814-zc5j-cloudflare-development-cpu-redeploy.txt'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/authorized-zc5j-cloudflare-development-cpu-redeploy.yml'
      - '.ops/authorizations/20260814-zc5j-cloudflare-development-cpu-redeploy.txt'

permissions:
  contents: read

concurrency:
  group: authorized-zc5j-cloudflare-development-cpu-redeploy
  cancel-in-progress: false

jobs:
  execute:
    name: One-time DEVELOPMENT redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENNEXT_VERSION: '1.20.2'
      WRANGLER_VERSION: '4.122.0'
      COMPATIBILITY_DATE: '2026-08-11'
      WORKER_NAME: 'kdkmp-development-pilot'
      AUTHORIZED_SOURCE_BASE: 'ab0075e34e27e9b40f7ac244faa5efdbaf19911c'
      REDEPLOY_MESSAGE: 'ZC-5J authorized CPU optimization redeploy 20260814-ab0075e3'
      NEXT_PUBLIC_SUPABASE_URL: 'https://qdxybbcksjivcidsupbd.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_euYsJqXdmpF3NFWF-e8ZWg_QaVCPZ6P'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact authorization scope and source ancestry
        shell: bash
        run: |
          set -euo pipefail
          marker='.ops/authorizations/20260814-zc5j-cloudflare-development-cpu-redeploy.txt'
          test -s "$marker"
          grep -Fxq 'AUTHORIZED_BY_USER=true' "$marker"
          grep -Fxq 'TARGET=Cloudflare Workers Free DEVELOPMENT CPU optimization redeploy' "$marker"
          grep -Fxq 'WORKER_NAME=kdkmp-development-pilot' "$marker"
          grep -Fxq "AUTHORIZED_SOURCE_BASE=${AUTHORIZED_SOURCE_BASE}" "$marker"
          grep -Fxq 'REDEPLOY_COUNT=1' "$marker"
          grep -Fxq 'PURPOSE=ZC-5J CPU remediation and re-measurement' "$marker"
          grep -Fxq 'R2=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'PAID_SERVICES=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'CUSTOM_DOMAIN=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'PRODUCTION_CUTOVER=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'PRODUCTION_DATA=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'DATABASE_WRITE=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'WORKER_DELETE=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'ROLLBACK=NOT_AUTHORIZED' "$marker"
          grep -Fxq 'VERCEL_DEVELOPMENT=KEEP_INTACT' "$marker"
          git merge-base --is-ancestor "$AUTHORIZED_SOURCE_BASE" HEAD
          echo 'authorization_scope=PASS'
          echo 'authorized_source_ancestry=PASS'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Cloudflare toolchain in runner only
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.before-zc5j-redeploy
          cp package-lock.json /tmp/package-lock.json.before-zc5j-redeploy
          npm install --no-save --package-lock=false \
            "@opennextjs/cloudflare@${OPENNEXT_VERSION}" \
            "wrangler@${WRANGLER_VERSION}"
          cmp package.json /tmp/package.json.before-zc5j-redeploy
          cmp package-lock.json /tmp/package-lock.json.before-zc5j-redeploy
          test "$(npx --no-install wrangler --version | tr -d '\r')" = "$WRANGLER_VERSION"

      - name: Verify existing Worker and zero-cost account state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx --no-install wrangler whoami > /tmp/zc5j-whoami.txt
          grep -Fq "$CLOUDFLARE_ACCOUNT_ID" /tmp/zc5j-whoami.txt

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/subscriptions" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/zc5j-subscriptions-pre.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/zc5j-subscriptions-pre.json').read_text())
          if data.get('success') is not True:
              raise SystemExit('Cloudflare subscription read failed.')
          active_states = {'Trial', 'Provisioned', 'Paid', 'AwaitingPayment'}
          paid = []
          for item in data.get('result') or []:
              try:
                  price = float(item.get('price') or 0)
              except (TypeError, ValueError):
                  price = 0
              if item.get('state') in active_states and price > 0:
                  paid.append(item)
          print(f'predeploy_active_paid_account_subscription_count={len(paid)}')
          if paid:
              raise SystemExit('Zero-cost gate failed: active paid subscription detected.')
          PY

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/zc5j-workers-list.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/zc5j-workers-list.json').read_text())
          if data.get('success') is not True:
              raise SystemExit('Unable to list existing Workers.')
          worker = os.environ['WORKER_NAME']
          ids = {str(item.get('id')) for item in (data.get('result') or [])}
          print(f'pilot_worker_preexisting={str(worker in ids).lower()}')
          if worker not in ids:
              raise SystemExit('Authorized redeploy requires the existing DEVELOPMENT Worker; refusing create.')
          PY

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/zc5j-workers-subdomain.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/zc5j-workers-subdomain.json').read_text())
          subdomain = (data.get('result') or {}).get('subdomain') if data.get('success') else None
          if not subdomain:
              raise SystemExit('Existing workers.dev subdomain unavailable; executor will not create one.')
          host = f"{os.environ['WORKER_NAME']}.{subdomain}.workers.dev"
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'PILOT_HOST={host}\n')
          print(f'pilot_host={host}')
          PY

      - name: Verify current bindings and enforce one-time deployment marker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/zc5j-worker-settings-pre.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/zc5j-worker-settings-pre.json').read_text())
          if data.get('success') is not True:
              raise SystemExit('Unable to read current Worker settings.')
          bindings = (data.get('result') or {}).get('bindings') or []
          types = sorted({str(item.get('type', '')).lower() for item in bindings})
          forbidden_terms = ('r2', 'kv', 'd1', 'durable', 'service', 'hyperdrive', 'queue', 'vectorize', 'ai')
          bad = [t for t in types if any(term in t for term in forbidden_terms)]
          print(f'predeploy_binding_types={",".join(types) if types else "none"}')
          if bad:
              raise SystemExit(f'Forbidden pre-existing binding types: {bad}')
          print('predeploy_forbidden_binding_count=0')
          PY

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/zc5j-deployments-pre.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/zc5j-deployments-pre.json').read_text())
          if data.get('success') is not True:
              raise SystemExit('Unable to list current Worker deployments.')
          result = data.get('result') or []
          deployments = result.get('deployments', []) if isinstance(result, dict) else result
          if not deployments:
              raise SystemExit('Existing Worker has no deployment history; refusing overwrite.')
          marker = os.environ['REDEPLOY_MESSAGE']
          matching = [d for d in deployments if (d.get('annotations') or {}).get('workers/message') == marker]
          print(f'predeploy_matching_redeploy_marker_count={len(matching)}')
          if matching:
              raise SystemExit('One-time ZC-5J redeploy marker already exists; refusing second redeploy.')
          latest = max(deployments, key=lambda d: str(d.get('created_on') or ''))
          versions = latest.get('versions') or []
          if not versions:
              raise SystemExit('Unable to resolve current active Worker version.')
          active = max(versions, key=lambda v: float(v.get('percentage') or 0))
          version_id = str(active.get('version_id') or '')
          if not version_id:
              raise SystemExit('Current active Worker version is missing.')
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'PREDEPLOY_VERSION_ID={version_id}\n')
          print(f'predeploy_version_id={version_id}')
          PY

      - name: Create disposable zero-binding config
        shell: bash
        run: |
          set -euo pipefail
          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          export default defineCloudflareConfig();
          EOF

          python3 - <<'PY'
          import json, os
          config = {
              '$schema': './node_modules/wrangler/config-schema.json',
              'name': os.environ['WORKER_NAME'],
              'main': '.open-next/worker.js',
              'compatibility_date': os.environ['COMPATIBILITY_DATE'],
              'workers_dev': True,
              'assets': {'directory': '.open-next/assets', 'binding': 'ASSETS'},
              'vars': {
                  'NEXT_PUBLIC_SUPABASE_URL': os.environ['NEXT_PUBLIC_SUPABASE_URL'],
                  'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY': os.environ['NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY'],
              },
          }
          with open('wrangler.jsonc', 'w') as fh:
              json.dump(config, fh, indent=2)
              fh.write('\n')
          PY

          if grep -Eiq 'r2_buckets|d1_databases|kv_namespaces|durable_objects|hyperdrive|queues|services|routes|custom_domain|vectorize|"ai"' wrangler.jsonc; then
            echo 'Forbidden Cloudflare binding, route, or paid-capability configuration detected.' >&2
            exit 1
          fi
          echo 'zero_binding_config=PASS'

      - name: Build OpenNext with runner-only Edge bridge
        shell: bash
        run: |
          set -euo pipefail
          test -s src/proxy.ts
          test ! -e src/middleware.ts
          cp src/proxy.ts /tmp/zc5j-proxy.original
          python3 - <<'PY'
          from pathlib import Path
          src = Path('src/proxy.ts').read_text()
          needle = 'export async function proxy(request: NextRequest)'
          replacement = 'export async function middleware(request: NextRequest)'
          if src.count(needle) != 1:
              raise SystemExit('Expected exactly one Next.js 16 proxy export.')
          Path('src/middleware.ts').write_text(src.replace(needle, replacement))
          PY
          rm src/proxy.ts
          npx --no-install opennextjs-cloudflare build 2>&1 | tee /tmp/zc5j-opennext-build.log
          test -s .open-next/worker.js
          test -d .open-next/assets
          if grep -Fq 'Node.js middleware is not currently supported' /tmp/zc5j-opennext-build.log; then
            echo 'OpenNext detected unsupported Node Middleware.' >&2
            exit 1
          fi
          rm -f src/middleware.ts
          cp /tmp/zc5j-proxy.original src/proxy.ts
          test -z "$(git status --porcelain -- src)"
          echo 'tracked_source_restored=true'

      - name: Strict Wrangler dry-run and size gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/zc5j-wrangler-out
          npx --no-install wrangler deploy --dry-run --keep-vars --strict \
            --outdir /tmp/zc5j-wrangler-out 2>&1 | tee /tmp/zc5j-wrangler-dry-run.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/zc5j-wrangler-dry-run.log').read_text(errors='replace')
          matches = re.findall(r'gzip:\s*([0-9]+(?:\.[0-9]+)?)\s*KiB', text, flags=re.I)
          if not matches:
              raise SystemExit('Unable to parse compressed Worker size.')
          size = float(matches[-1])
          print(f'wrangler_gzip_size_kib={size:.2f}')
          if size >= 2304:
              raise SystemExit('Worker exceeds internal 75% Free-plan size budget.')
          print('worker_size_internal_budget=PASS')
          PY

      - name: Confirm PR phase performs no remote write
        if: github.event_name == 'pull_request'
        run: |
          echo 'pr_remote_redeployment_attempted=false'
          echo 'pr_r2_write_attempted=false'
          echo 'pr_paid_service_activation_attempted=false'
          echo 'pr_custom_domain_change_attempted=false'

      - name: Redeploy exactly once to existing DEVELOPMENT Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --keep-vars --strict \
            --message "$REDEPLOY_MESSAGE" 2>&1 | tee /tmp/zc5j-redeploy.log
          echo 'remote_redeployment_attempted=true'
          echo 'authorized_redeploy_count=1'

      - name: Verify version transition and remote route contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/zc5j-deployments-post.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/zc5j-deployments-post.json').read_text())
          if data.get('success') is not True:
              raise SystemExit('Unable to read postdeploy deployment history.')
          result = data.get('result') or []
          deployments = result.get('deployments', []) if isinstance(result, dict) else result
          marker = os.environ['REDEPLOY_MESSAGE']
          matching = [d for d in deployments if (d.get('annotations') or {}).get('workers/message') == marker]
          print(f'postdeploy_matching_redeploy_marker_count={len(matching)}')
          if len(matching) != 1:
              raise SystemExit('Exactly one authorized ZC-5J redeploy marker was expected.')
          versions = matching[0].get('versions') or []
          if not versions:
              raise SystemExit('New deployment has no version reference.')
          active = max(versions, key=lambda v: float(v.get('percentage') or 0))
          new_version = str(active.get('version_id') or '')
          old_version = os.environ['PREDEPLOY_VERSION_ID']
          print(f'postdeploy_version_id={new_version}')
          if not new_version or new_version == old_version:
              raise SystemExit('Redeploy did not transition to a new Worker version.')
          print('worker_version_transition=PASS')
          PY

          base="https://${PILOT_HOST}"
          request_status() {
            local path="$1"
            local headers="$2"
            local body="$3"
            curl --silent --show-error --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "${base}${path}"
          }

          health='000'
          for attempt in $(seq 1 12); do
            health="$(request_status '/api/health' /tmp/health.headers /tmp/health.body || true)"
            [ "$health" = '200' ] && break
            sleep 5
          done
          test "$health" = '200'
          root="$(request_status '/' /tmp/root.headers /tmp/root.body)"
          login="$(request_status '/login' /tmp/login.headers /tmp/login.body)"
          dashboard="$(request_status '/dashboard' /tmp/dashboard.headers /tmp/dashboard.body)"
          test "$root" = '307'
          test "$login" = '200'
          test "$dashboard" = '307'
          grep -Eiq '^location: .*\/dashboard' /tmp/root.headers
          grep -Eiq '^location: .*\/login' /tmp/dashboard.headers
          echo 'remote_health_status=200'
          echo 'remote_root_redirect=PASS'
          echo 'remote_login_status=200'
          echo 'remote_unauth_dashboard_guard=PASS'

      - name: Verify postdeploy bindings and zero-cost state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/zc5j-worker-settings-post.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/zc5j-worker-settings-post.json').read_text())
          if data.get('success') is not True:
              raise SystemExit('Unable to read postdeploy Worker settings.')
          bindings = (data.get('result') or {}).get('bindings') or []
          types = sorted({str(item.get('type', '')).lower() for item in bindings})
          forbidden_terms = ('r2', 'kv', 'd1', 'durable', 'service', 'hyperdrive', 'queue', 'vectorize', 'ai')
          bad = [t for t in types if any(term in t for term in forbidden_terms)]
          print(f'postdeploy_binding_types={",".join(types) if types else "none"}')
          if bad:
              raise SystemExit(f'Forbidden postdeploy binding types: {bad}')
          print('postdeploy_forbidden_binding_count=0')
          PY

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/subscriptions" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/zc5j-subscriptions-post.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/zc5j-subscriptions-post.json').read_text())
          active_states = {'Trial', 'Provisioned', 'Paid', 'AwaitingPayment'}
          paid = []
          for item in data.get('result') or []:
              try:
                  price = float(item.get('price') or 0)
              except (TypeError, ValueError):
                  price = 0
              if item.get('state') in active_states and price > 0:
                  paid.append(item)
          print(f'postdeploy_active_paid_account_subscription_count={len(paid)}')
          if paid:
              raise SystemExit('Paid subscription appeared after redeploy.')
          print('postdeploy_zero_cost_subscription_gate=PASS')
          PY

      - name: Final boundary record
        if: always()
        run: |
          echo 'authorized_redeploy_limit=1'
          echo 'worker_name=kdkmp-development-pilot'
          echo 'r2_activated=false'
          echo 'paid_service_activated=false'
          echo 'custom_domain_configured=false'
          echo 'production_cutover=false'
          echo 'production_data_used=false'
          echo 'database_write_attempted=false'
          echo 'worker_delete_attempted=false'
          echo 'rollback_attempted=false'
          echo 'vercel_development_kept_intact=true'

      - name: Confirm runner tooling did not mutate tracked application files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/package.json.before-zc5j-redeploy ]; then
            cmp package.json /tmp/package.json.before-zc5j-redeploy
            cmp package-lock.json /tmp/package-lock.json.before-zc5j-redeploy
          fi
          test -z "$(git status --porcelain -- package.json package-lock.json src)"
          echo 'repository_source_mutation=false'
