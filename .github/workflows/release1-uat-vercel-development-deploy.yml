name: Release 1 UAT Vercel DEVELOPMENT Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release1-uat-vercel-development-deploy.yml

permissions:
  contents: read

concurrency:
  group: release1-uat-vercel-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: team_58pKkL8YiBeenw1FRAYcKsrx
      VERCEL_PROJECT_ID: prj_ITkValMHsXHflGI0qKLHoCgYYB9n
      RELEASE_SHA: ccb20e00c9ac42f70e6135cae5f558e560c1add4
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 2
          fi

      - name: Checkout frozen Release 1 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify frozen SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Re-verify application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          npm run typecheck
          npm run build

      - name: Pull Vercel DEVELOPMENT project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=nofilanirahmawan-1452s-projects

      - name: Build Vercel DEVELOPMENT artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel build --prod --token="$VERCEL_TOKEN" --scope=nofilanirahmawan-1452s-projects

      - name: Deploy to Vercel DEVELOPMENT primary target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope=nofilanirahmawan-1452s-projects
