name: Application CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Detect application
        id: app
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No application package.json on this revision; verification is skipped."
          fi

      - name: Setup Node.js
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate lockfile when missing
        if: steps.app.outputs.present == 'true'
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Persist generated lockfile to same-repository PR branch
        if: steps.app.outputs.present == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: generate package lock"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "package-lock.json already current"
          fi

      - name: Install dependencies from lockfile
        if: steps.app.outputs.present == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.app.outputs.present == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
