name: POS Cash Reversal CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'database/migrations/**pos_cash_reversal**'
      - 'database/tests/pos_cash_reversal_rollback.sql'
      - 'src/app/dashboard/pos/reversal-actions.ts'
      - 'src/types/pos-reversal.ts'
      - '.github/workflows/pos-cash-reversal-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**pos_cash_reversal**'
      - 'database/tests/pos_cash_reversal_rollback.sql'
      - 'src/app/dashboard/pos/reversal-actions.ts'
      - 'src/types/pos-reversal.ts'
      - '.github/workflows/pos-cash-reversal-ci.yml'

permissions:
  contents: read

concurrency:
  group: pos-cash-reversal-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_CLI_VERSION: "2.113.0"
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      HISTORICAL_DEMO_BOOTSTRAP: database/seeds/001_development_demo_organization.sql
      HISTORICAL_DEMO_FIXTURE_NAME: 20260811100000_ci_historical_demo_bootstrap.sql
      POS_ACCOUNTING_SEED: database/seeds/20260811_pos_demo_accounting_seed.sql
      POS_ACCOUNTING_FIXTURE_NAME: 20260811153000_ci_pos_demo_accounting_seed.sql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_VERSION="$(npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version | tr -d '\r')"
          test "$ACTUAL_VERSION" = "$SUPABASE_CLI_VERSION"
          echo "Using pinned Supabase CLI $ACTUAL_VERSION"

      - name: Prepare isolated migration workspace
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test -s database/tests/pos_cash_reversal_rollback.sql
          test -s "$HISTORICAL_DEMO_BOOTSTRAP"
          test -s "$POS_ACCOUNTING_SEED"
          WORKDIR="$RUNNER_TEMP/kdkmp-pos-reversal-ci"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init >/dev/null
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/database/migrations/*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE/$HISTORICAL_DEMO_BOOTSTRAP" "supabase/migrations/$HISTORICAL_DEMO_FIXTURE_NAME"
          cp "$GITHUB_WORKSPACE/$POS_ACCOUNTING_SEED" "supabase/migrations/$POS_ACCOUNTING_FIXTURE_NAME"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"

      - name: Start local Supabase and replay migrations
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.prepare.outputs.workdir }}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db start

      - name: Exercise atomic POS cash reversal and rollback
        shell: bash
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            psql "$LOCAL_DB_URL" -X -v ON_ERROR_STOP=1 -f database/tests/pos_cash_reversal_rollback.sql
          else
            docker run --rm --network host -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace postgres:17-alpine \
              psql "$LOCAL_DB_URL" -X -v ON_ERROR_STOP=1 -f database/tests/pos_cash_reversal_rollback.sql
          fi

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          cd "${{ steps.prepare.outputs.workdir }}" || exit 0
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true
