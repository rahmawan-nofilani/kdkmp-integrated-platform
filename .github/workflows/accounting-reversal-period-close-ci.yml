name: Accounting Reversal & Period Close CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'database/migrations/**accounting_manual_reversal_period_close.sql'
      - 'database/migrations/**accounting_reversal_close_acl_hardening.sql'
      - 'database/tests/accounting_reversal_period_close.sql'
      - 'database/tests/accounting_reversal_period_close_acl.sql'
      - '.github/workflows/accounting-reversal-period-close-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'database/migrations/**accounting_manual_reversal_period_close.sql'
      - 'database/migrations/**accounting_reversal_close_acl_hardening.sql'
      - 'database/tests/accounting_reversal_period_close.sql'
      - 'database/tests/accounting_reversal_period_close_acl.sql'
      - '.github/workflows/accounting-reversal-period-close-ci.yml'

permissions:
  contents: read

concurrency:
  group: accounting-reversal-period-close-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accounting-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_CLI_VERSION: "2.113.0"
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      HISTORICAL_DEMO_BOOTSTRAP: database/seeds/001_development_demo_organization.sql
      HISTORICAL_DEMO_FIXTURE_NAME: 20260811100000_ci_historical_demo_bootstrap.sql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_VERSION="$(npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version | tr -d '\r')"
          test "$ACTUAL_VERSION" = "$SUPABASE_CLI_VERSION"

      - name: Prepare isolated migration workspace
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test -s database/tests/accounting_reversal_period_close.sql
          test -s database/tests/accounting_reversal_period_close_acl.sql
          WORKDIR="$RUNNER_TEMP/kdkmp-accounting-reversal-close-ci"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init >/dev/null
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/database/migrations/*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE/$HISTORICAL_DEMO_BOOTSTRAP" "supabase/migrations/$HISTORICAL_DEMO_FIXTURE_NAME"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"

      - name: Start local Supabase and replay migrations
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.prepare.outputs.workdir }}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db start

      - name: Exercise manual reversal and period close flow
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -X -v ON_ERROR_STOP=1 -f database/tests/accounting_reversal_period_close.sql

      - name: Assert private helper ACL boundary
        shell: bash
        run: |
          set -euo pipefail
          psql "$LOCAL_DB_URL" -X -v ON_ERROR_STOP=1 -f database/tests/accounting_reversal_period_close_acl.sql

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          cd "${{ steps.prepare.outputs.workdir }}" || exit 0
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup || true
