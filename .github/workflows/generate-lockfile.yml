name: Generate npm lockfile

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch that contains package.json and should receive package-lock.json
        required: true
        default: agent/phase-1-app-shell
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile to target branch
        shell: bash
        run: |
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "package-lock.json is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate package lock"
          git push origin HEAD:${{ inputs.target_branch }}
