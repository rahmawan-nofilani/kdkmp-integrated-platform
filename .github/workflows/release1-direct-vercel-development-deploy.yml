name: Release 1 Direct Vercel DEVELOPMENT Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release1-direct-vercel-development-deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - ops/release1-vercel-deploy-trigger.txt

permissions:
  contents: read

concurrency:
  group: release1-direct-vercel-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: team_58pKkL8YiBeenw1FRAYcKsrx
      VERCEL_PROJECT_ID: prj_ITkValMHsXHflGI0qKLHoCgYYB9n
      VERCEL_PROJECT_NAME: kdkmp-development
      GITHUB_ORG: rahmawan-nofilani
      GITHUB_REPO: kdkmp-integrated-platform
    steps:
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 2
          fi

      - name: Create Vercel deployment from GitHub main
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          BODY="$(jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$GITHUB_ORG" \
            --arg repo "$GITHUB_REPO" \
            '{
              name: $name,
              project: $project,
              target: "production",
              gitSource: {
                type: "github",
                org: $org,
                repo: $repo,
                ref: "main"
              },
              withLatestCommit: true,
              meta: {
                release: "release1-uat-development",
                environment_classification: "DEVELOPMENT"
              }
            }')"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$BODY")"

          DEPLOYMENT_ID="$(printf '%s' "$RESPONSE" | jq -r '.id // empty')"
          DEPLOYMENT_URL="$(printf '%s' "$RESPONSE" | jq -r '.url // empty')"
          DEPLOYMENT_STATUS="$(printf '%s' "$RESPONSE" | jq -r '.status // .readyState // empty')"

          test -n "$DEPLOYMENT_ID"
          echo "Deployment created: $DEPLOYMENT_ID"
          echo "URL: $DEPLOYMENT_URL"
          echo "Initial status: $DEPLOYMENT_STATUS"
