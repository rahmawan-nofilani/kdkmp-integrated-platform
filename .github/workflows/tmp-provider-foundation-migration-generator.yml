name: Temporary provider foundation migration generator

on:
  push:
    branches:
      - agent/pos-trusted-provider-confirmation-reconciliation

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'generated provider confirmation migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pos-trusted-provider-confirmation-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate canonical migration with pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_VERSION="$(npx --yes supabase@2.113.0 --version | tr -d '\r')"
          test "$ACTUAL_VERSION" = "2.113.0"
          tmp="$(mktemp -d)"
          cd "$tmp"
          npx --yes supabase@2.113.0 migration new pos_trusted_provider_confirmation_reconciliation_foundation
          file="$(find supabase/migrations -maxdepth 1 -type f | head -n 1)"
          filename="$(basename "$file")"
          cd "$GITHUB_WORKSPACE"
          : > "database/migrations/$filename"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "database/migrations/$filename"
          git commit -m "generated provider confirmation migration"
          git push origin HEAD:agent/pos-trusted-provider-confirmation-reconciliation
          echo "generated=$filename"
